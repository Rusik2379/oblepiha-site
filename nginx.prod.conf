server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 9m;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;

    # Preserve query parameters while consolidating the public domain and home URL.
    if ($host = www.oblepiha-22.ru) { return 308 https://oblepiha-22.ru$request_uri; }
    location = /index.html { return 308 https://oblepiha-22.ru/$is_args$args; }

    # Public CMS content and sitemap must reach Node for search-engine rendering.
    location ~ ^/(?:news\.html|vacancies\.html|sitemap\.xml)?$ {
        proxy_pass http://oblepiha-news:3000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://oblepiha-news:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /news-media/ {
        proxy_pass http://oblepiha-news:3000;
        proxy_set_header Host $host;
    }

    location = /editor.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ ^/(server|node_modules|tools|shared|site-data|exports)(/|$) { deny all; }
    location ~ \.(yml|yaml|conf|md|mjs)$ { deny all; }

    # Не отдаём наружу .git и другие скрытые файлы
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
