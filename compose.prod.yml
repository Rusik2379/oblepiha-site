services:
  oblepiha-site:
    image: nginx:alpine
    container_name: oblepiha-site
    restart: unless-stopped
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oblepiha-news
    networks:
      - proxy-net
      - news-net

  oblepiha-news:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: node server/server.mjs
    env_file:
      - .env.news
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NEWS_DATA_DIR: /data
      TRUST_PROXY: 1
    volumes:
      - ./server:/app/server:ro
      - ./news-seed.json:/app/news-seed.json:ro
      - ./assets:/app/assets:ro
      - ./index.html:/app/index.html:ro
      - ./news.html:/app/news.html:ro
      - ./vacancies.html:/app/vacancies.html:ro
      - news-data:/data
    networks:
      - news-net

volumes:
  news-data:

networks:
  proxy-net:
    external: true
  news-net:
