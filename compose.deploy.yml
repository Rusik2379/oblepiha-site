services:
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site
  site:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    command: node server/server.mjs
    env_file:
      - .env.news
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NEWS_DATA_DIR: /data
      TRUST_PROXY: 1
    volumes:
      - ./:/app:ro
      - ./site-data:/data
volumes:
  caddy-data:
  caddy-config:
